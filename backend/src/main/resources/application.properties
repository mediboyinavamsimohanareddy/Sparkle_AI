spring.application.name=nova-ai-backend
server.port=8080

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:novaai_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# File Storage Properties
novaai.upload.dir=${UPLOAD_DIR:uploads}

# AI Service Gateway / Gemini API Configuration
novaai.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
novaai.ai.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:${AI_API_KEY:}}}
novaai.ai.model=${AI_MODEL:gemini-3.5-flash-lite}

